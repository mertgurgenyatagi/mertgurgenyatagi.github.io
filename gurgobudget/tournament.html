<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bracket</title>
<meta name="description" content="A single-elimination bracket to pick a winner among the fifty GurgoBudget dashboard looks, one matchup at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Hallmark · component: bracket-tool · genre: editorial (utilitarian) · theme: shell = graphite/amber, carried over from exhibition.html
 * states: default · hover · focus · active · disabled(n/a) · loading(n/a) · error(n/a) · success(winner)
 */

/* ════════════  SHELL (shared with exhibition.html)  ════════════ */
:root{
  --shell-paper:oklch(15% .011 62);
  --shell-paper-2:oklch(19% .012 62);
  --shell-ink:oklch(94% .008 82);
  --shell-muted:oklch(67% .013 72);
  --shell-rule:oklch(29% .012 62);
  --shell-accent:oklch(79% .148 78);
  --shell-good:oklch(75% .16 148);

  --font-shell-display:"Archivo","Trebuchet MS",sans-serif;
  --font-shell-body:"Geist",ui-sans-serif,system-ui,sans-serif;
  --font-shell-mono:"Geist Mono",ui-monospace,"Courier New",monospace;

  --space-3xs:4px;--space-2xs:8px;--space-xs:12px;--space-sm:16px;
  --space-md:24px;--space-lg:32px;--space-xl:48px;--space-2xl:72px;--space-3xl:112px;

  --ease-out:cubic-bezier(.22,1,.36,1);
  --dur-instant:90ms;--dur-short:150ms;--dur-mid:260ms;
}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:clip}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
body{
  margin:0;background:var(--shell-paper);color:var(--shell-ink);
  font-family:var(--font-shell-body);font-size:16px;line-height:1.6;font-weight:300;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;display:flex;flex-direction:column;
}
:focus-visible{outline:2px solid var(--shell-accent);outline-offset:3px}
a{color:inherit}
button{font:inherit;color:inherit}

/* the specimen frame — identical contract to exhibition.html */
.screen{
  width:390px;height:844px;overflow:hidden;
  display:flex;flex-direction:column;
  font-variant-numeric:tabular-nums;
  font-synthesis-weight:none;
}
.screen *{min-width:0}
.screen button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.screen ul{list-style:none;margin:0;padding:0}
.screen h1,.screen h2,.screen h3,.screen p{margin:0;font-style:normal}
.screen a{text-decoration:none}

/* ════════════  TOURNAMENT CHROME  ════════════ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-md);
  padding:var(--space-sm) clamp(20px,4vw,40px);border-bottom:1px solid var(--shell-rule);
  flex-wrap:wrap;
}
.topbar__back{
  font-family:var(--font-shell-mono);font-size:.72rem;letter-spacing:.08em;color:var(--shell-muted);
  transition:color var(--dur-short) var(--ease-out);
}
.topbar__back:hover{color:var(--shell-accent)}
.topbar__title{
  font-family:var(--font-shell-display);font-weight:900;font-size:1.05rem;letter-spacing:-.02em;
  margin:0;
}
.topbar__prog{
  font-family:var(--font-shell-mono);font-size:.72rem;letter-spacing:.06em;color:var(--shell-muted);
  white-space:nowrap;
}
.topbar__prog b{color:var(--shell-accent);font-weight:700}

.rail{height:2px;background:var(--shell-rule);position:relative}
.rail__fill{
  position:absolute;inset:0 auto 0 0;height:100%;background:var(--shell-accent);
  width:0%;transition:width var(--dur-mid) var(--ease-out);
}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:var(--space-xl) clamp(16px,4vw,40px)}

/* ─ matchup ─ */
.matchup{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:clamp(16px,3vw,48px);max-width:1100px;width:100%;
}
.side{display:flex;flex-direction:column;align-items:center;gap:var(--space-sm)}
.side__label{
  font-family:var(--font-shell-mono);font-size:.72rem;letter-spacing:.1em;color:var(--shell-muted);
  text-align:center;
}
.side__label b{color:var(--shell-ink);font-weight:600}
.side__label span{color:var(--shell-accent)}
.stage{
  width:293px;height:633px;overflow:hidden;border-radius:6px;
  border:1px solid var(--shell-rule);cursor:pointer;
  transition:border-color var(--dur-short) var(--ease-out),transform var(--dur-short) var(--ease-out);
}
.stage:hover{border-color:var(--shell-accent);transform:translateY(-2px)}
.stage:active{transform:translateY(0)}
.stage > .screen{transform:scale(0.75);transform-origin:top left}
.pick{
  width:100%;max-width:293px;
  padding:13px 20px;border-radius:999px;border:1px solid var(--shell-accent);
  background:none;color:var(--shell-accent);
  font-family:var(--font-shell-mono);font-weight:500;font-size:.82rem;letter-spacing:.04em;
  cursor:pointer;text-align:center;
  transition:background-color var(--dur-short) var(--ease-out),color var(--dur-short) var(--ease-out);
}
.pick:hover{background:var(--shell-accent);color:var(--shell-paper)}
.pick:active{transform:translateY(1px)}

.vs{
  font-family:var(--font-shell-display);font-weight:900;font-size:1.4rem;letter-spacing:-.02em;
  color:var(--shell-rule);align-self:center;
}

/* ─ bye ─ */
.bye{
  display:flex;flex-direction:column;align-items:center;gap:var(--space-lg);text-align:center;
  max-width:420px;
}
.bye__k{
  font-family:var(--font-shell-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--shell-muted);
}
.bye__t{
  font-family:var(--font-shell-display);font-weight:900;font-size:clamp(1.6rem,3vw,2.2rem);
  letter-spacing:-.03em;margin:0;overflow-wrap:anywhere;
}
.bye__t em{font-style:normal;color:var(--shell-accent)}
.bye__p{color:var(--shell-muted);margin:0;font-size:.92rem;max-width:38ch}
.bye .stage{width:220px;height:475px}
.bye .stage > .screen{transform:scale(0.564)}

/* ─ winner ─ */
.win{
  display:flex;flex-direction:column;align-items:center;gap:var(--space-md);text-align:center;
}
.win__k{
  font-family:var(--font-shell-mono);font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--shell-accent);
}
.win__t{
  font-family:var(--font-shell-display);font-weight:900;font-size:clamp(2.2rem,6vw,4rem);
  letter-spacing:-.04em;margin:0;line-height:1;overflow-wrap:anywhere;
}
.win__meta{
  font-family:var(--font-shell-mono);font-size:.8rem;color:var(--shell-muted);letter-spacing:.02em;
}
.win__meta b{color:var(--shell-ink);font-weight:500}
.win .stage{width:293px;height:633px;margin-top:var(--space-sm);cursor:default}
.win .stage:hover{border-color:var(--shell-rule);transform:none}
.win__actions{display:flex;gap:var(--space-sm);margin-top:var(--space-md);flex-wrap:wrap;justify-content:center}
.btn{
  padding:12px 24px;border-radius:999px;font-family:var(--font-shell-mono);font-weight:500;
  font-size:.82rem;letter-spacing:.04em;cursor:pointer;transition:opacity var(--dur-short) var(--ease-out);
}
.btn--solid{background:var(--shell-accent);color:var(--shell-paper);border:1px solid var(--shell-accent)}
.btn--ghost{background:none;color:var(--shell-muted);border:1px solid var(--shell-rule)}
.btn:hover{opacity:.85}
.btn:active{transform:translateY(1px)}

@media (max-width: 760px){
  .matchup{grid-template-columns:1fr}
  .vs{padding:var(--space-2xs) 0}
  .stage{width:100%;max-width:293px;margin-inline:auto}
}

/* ════════════  36 SPECIMEN TOKEN BLOCKS + MARKUP STYLES  ════════════ */
.d01{--paper:oklch(96% .014 84);--ink:oklch(24% .03 52);--muted:oklch(55% .022 60);
  --rule:oklch(85% .016 84);--accent:oklch(55% .162 40);
  background:var(--paper);color:var(--ink);font-family:"Inter", ui-sans-serif, system-ui, sans-serif;
  font-weight:400;padding:30px 26px 0}

  padding-bottom:14px;border-bottom:1px solid var(--rule)}
.d01 .mark{font-family:"Inter", ui-sans-serif, system-ui, sans-serif;font-weight:700;font-size:17px;letter-spacing:-.02em}

.d01 .lede{padding:34px 0 26px}
.d01 .lede h1{font-size:11px;font-variant-caps:all-small-caps;letter-spacing:.2em;color:var(--muted);font-weight:400}
.d01 .fig{font-family:"Inter", ui-sans-serif, system-ui, sans-serif;font-weight:700;font-size:76px;line-height:.94;
  letter-spacing:-.035em;margin-top:6px;display:block}
.d01 .fig i{font-style:normal;font-size:34px;color:var(--muted);vertical-align:.5em;margin-right:2px}
.d01 .note{margin-top:12px;font-size:13.5px;color:var(--muted)}
.d01 .note b{color:var(--accent);font-weight:600}

  border-block:1px solid var(--rule);padding:14px 0}
.d01 .three div+div{padding-left:14px;border-left:1px solid var(--rule)}

.d02{--paper:oklch(92% .006 96);--ink:oklch(17% .008 60);--muted:oklch(47% .01 70);

  border-block:1px solid var(--ink);padding:9px 0;margin-top:10px}

.d02 .save b{font-family:"Inter", ui-sans-serif, system-ui, sans-serif;font-size:26px;color:var(--accent)}
.d02 .today{grid-column:span 2;display:flex;justify-content:space-between;align-items:center;padding:10px 0}

  padding:11px 0;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase}

<script>
(function(){
  const SPECIMENS = JSON.parse(document.getElementById('specimen-data').textContent);
  const stageArea = document.getElementById('stage-area');
  const progEl = document.getElementById('prog');
  const railEl = document.getElementById('rail');

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  const totalRounds = Math.ceil(Math.log2(SPECIMENS.length));
  let pool, round, queue, matchIndex, nextPool, totalThisRound;

  function startTournament(){
    pool = shuffle(SPECIMENS.slice());
    round = 1;
    buildRound();
    render();
  }

  function buildRound(){
    const p = shuffle(pool.slice());
    queue = [];
    if (p.length % 2 === 1){
      queue.push({ bye: p.pop() });
    }
    for (let i = 0; i < p.length; i += 2){
      queue.push({ a: p[i], b: p[i+1] });
    }
    shuffle(queue);
    matchIndex = 0;
    nextPool = [];
    totalThisRound = queue.length;
  }

  function updateProgress(){
    progEl.innerHTML = 'Round <b>' + round + '</b> of ' + totalRounds +
      ' · ' + pool.length + ' left · matchup ' + (matchIndex + 1) + '/' + totalThisRound;
    const doneRounds = round - 1;
    const roundFrac = matchIndex / Math.max(totalThisRound, 1);
    const pct = Math.min(100, ((doneRounds + roundFrac) / totalRounds) * 100);
    railEl.style.width = pct + '%';
  }

  function render(){
    if (pool.length === 1){ renderWinner(pool[0]); return; }
    if (matchIndex >= queue.length){
      pool = nextPool;
      round++;
      if (pool.length === 1){ renderWinner(pool[0]); return; }
      buildRound();
    }
    updateProgress();
    const m = queue[matchIndex];
    if (m.bye) renderBye(m.bye);
    else renderMatch(m.a, m.b);
  }

  function choose(winner){
    nextPool.push(winner);
    matchIndex++;
    render();
  }

  function continueBye(item){
    nextPool.push(item);
    matchIndex++;
    render();
  }

  function sideMarkup(s, otherName){
    return '' +
      '<div class="side">' +
        '<div class="side__label">' + String(s.num).padStart(2,'0') + ' · <b>' + s.name + '</b><br><span>' + s.fonts + '</span></div>' +
        '<div class="stage" data-pick tabindex="0" role="button" aria-label="Choose ' + s.name + ' over ' + otherName + '">' + s.html + '</div>' +
        '<button class="pick" type="button" data-pick>Choose ' + s.name + '</button>' +
      '</div>';
  }

  function renderMatch(a, b){
    stageArea.innerHTML =
      '<div class="matchup">' +
        sideMarkup(a, b.name) +
        '<div class="vs">VS</div>' +
        sideMarkup(b, a.name) +
      '</div>';
    const sides = stageArea.querySelectorAll('.side');
    sides[0].querySelectorAll('[data-pick]').forEach(function(el){
      el.addEventListener('click', function(){ choose(a); });
      el.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); choose(a); } });
    });
    sides[1].querySelectorAll('[data-pick]').forEach(function(el){
      el.addEventListener('click', function(){ choose(b); });
      el.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); choose(b); } });
    });
  }

  function renderBye(item){
    stageArea.innerHTML =
      '<div class="bye">' +
        '<p class="bye__k">Odd one out this round</p>' +
        '<h2 class="bye__t"><em>' + item.name + '</em> draws a bye</h2>' +
        '<p class="bye__p">No match to judge it against this round — it advances automatically.</p>' +
        '<div class="stage" style="cursor:default">' + item.html + '</div>' +
        '<button class="btn btn--solid" type="button" id="byeContinue">Continue</button>' +
      '</div>';
    stageArea.querySelector('.stage').style.pointerEvents = 'none';
    document.getElementById('byeContinue').addEventListener('click', function(){ continueBye(item); });
  }

  function renderWinner(s){
    progEl.innerHTML = 'Winner decided';
    railEl.style.width = '100%';
    stageArea.innerHTML =
      '<div class="win">' +
        '<p class="win__k">Winner</p>' +
        '<h2 class="win__t">' + s.name + '</h2>' +
        '<p class="win__meta"><b>' + s.fonts + '</b> · ' + s.palette + '</p>' +
        '<div class="stage">' + s.html + '</div>' +
        '<div class="win__actions">' +
          '<button class="btn btn--solid" type="button" id="restart">Run it again</button>' +
          '<a class="btn btn--ghost" href="exhibition.html">Back to all fifty</a>' +
        '</div>' +
      '</div>';
    stageArea.querySelector('.stage').style.cursor = 'default';
    stageArea.querySelector('.stage').style.pointerEvents = 'none';
    document.getElementById('restart').addEventListener('click', startTournament);
  }

  startTournament();
})();
</script>

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://mertgurgenyatagi.github.io/
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            zealandtable/package-lock.json
            irishtable/package-lock.json
            iconictable/package-lock.json
            vizehtable/package-lock.json
            footydraft/package-lock.json

      # Every project below is cached on the hash of its own source tree,
      # computed right after checkout -- before any build step exists, so
      # dist/ and node_modules/ (both gitignored) can't leak into the hash.
      # A project whose files didn't change gets its dist/ restored instead
      # of rebuilt. This is what keeps one project's commit from spending CI
      # time rebuilding every *other* project too -- each key depends only on
      # that project's own tree, so it's unaffected by anything outside it.
      # A cache miss just means a normal full rebuild; nothing here can
      # publish something stale, only skip redundant work.

      # Served from /theirishtable/, NOT /irishtable/. The old path is burned:
      # a pitch email to a different channel carries a hyperlink to it, and
      # emails do not expire (see ZEALANDTABLE_HANDOVER.md 22). The source
      # folder keeps its original name; only the published path differs.
      - name: Cache irishtable build
        id: cache-irishtable
        uses: actions/cache@v4
        with:
          path: irishtable/dist
          key: irishtable-dist-${{ hashFiles('irishtable/**') }}

      - name: Build irishtable
        if: steps.cache-irishtable.outputs.cache-hit != 'true'
        run: |
          cd irishtable
          cat << 'EOF' > .env
          VITE_FIREBASE_API_KEY=AIzaSyBMRHhfb3dpWY0RMgpdBvvIbGeBFIl_fbk
          VITE_FIREBASE_AUTH_DOMAIN=irishtable-app.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=irishtable-app
          VITE_FIREBASE_APP_ID=1:378090040193:web:1e133f578f0b6e05c91680
          VITE_FIREBASE_STORAGE_BUCKET=irishtable-app.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=378090040193
          VITE_PHOTOS_ENABLED=false
          VITE_FIREBASE_DATABASE_URL=https://irishtable-app-default-rtdb.europe-west1.firebasedatabase.app
          EOF
          npm ci
          npm run build

      - name: Cache zealandtable build
        id: cache-zealandtable
        uses: actions/cache@v4
        with:
          path: zealandtable/dist
          key: zealandtable-dist-${{ hashFiles('zealandtable/**') }}

      - name: Build zealandtable
        if: steps.cache-zealandtable.outputs.cache-hit != 'true'
        run: |
          cd zealandtable
          cat << 'EOF' > .env
          VITE_FIREBASE_API_KEY=AIzaSyCSiZwyKFwZnGncqUcXcfAsZ5WbdPLlmv8
          VITE_FIREBASE_AUTH_DOMAIN=zealandtable-app.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=zealandtable-app
          VITE_FIREBASE_APP_ID=1:1046821268210:web:9d82477de3ead882effe6b
          VITE_FIREBASE_STORAGE_BUCKET=zealandtable-app.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=1046821268210
          VITE_PHOTOS_ENABLED=false
          VITE_FIREBASE_DATABASE_URL=https://zealandtable-app-default-rtdb.europe-west1.firebasedatabase.app
          EOF
          npm ci
          npm run build

      - name: Cache iconictable build
        id: cache-iconictable
        uses: actions/cache@v4
        with:
          path: iconictable/dist
          key: iconictable-dist-${{ hashFiles('iconictable/**') }}

      - name: Build iconictable
        if: steps.cache-iconictable.outputs.cache-hit != 'true'
        run: |
          cd iconictable
          cat << 'EOF' > .env
          VITE_FIREBASE_API_KEY=AIzaSyCifJYAM6DKFT8-4zc7EMDvFsfUyYrfuwU
          VITE_FIREBASE_AUTH_DOMAIN=iconictable-app.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=iconictable-app
          VITE_FIREBASE_APP_ID=1:765275086843:web:53ca844661e536c0d8755e
          VITE_FIREBASE_STORAGE_BUCKET=iconictable-app.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=765275086843
          VITE_PHOTOS_ENABLED=false
          VITE_FIREBASE_DATABASE_URL=https://iconictable-app-default-rtdb.europe-west1.firebasedatabase.app
          EOF
          npm ci
          npm run build

      - name: Cache vizehtable build
        id: cache-vizehtable
        uses: actions/cache@v4
        with:
          path: vizehtable/dist
          key: vizehtable-dist-${{ hashFiles('vizehtable/**') }}

      - name: Build vizehtable
        if: steps.cache-vizehtable.outputs.cache-hit != 'true'
        run: |
          cd vizehtable
          cat << 'EOF' > .env
          VITE_FIREBASE_API_KEY=AIzaSyBvI6Mn8eNIW6d-sy7K0Hmr-EUkIElFb_4
          VITE_FIREBASE_AUTH_DOMAIN=vizehtable-app.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=vizehtable-app
          VITE_FIREBASE_APP_ID=1:79438281238:web:1fcb1ad06e0666283b1337
          VITE_FIREBASE_STORAGE_BUCKET=vizehtable-app.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=79438281238
          VITE_PHOTOS_ENABLED=false
          VITE_FIREBASE_DATABASE_URL=https://vizehtable-app-default-rtdb.europe-west1.firebasedatabase.app
          EOF
          npm ci
          npm run build

      # No .env yet -- footydraft has no backend wired in yet, so there's
      # nothing to inject. Add the same heredoc pattern as the other four
      # once Firebase is actually wired into src/.
      - name: Cache footydraft build
        id: cache-footydraft
        uses: actions/cache@v4
        with:
          path: footydraft/dist
          key: footydraft-dist-${{ hashFiles('footydraft/**') }}

      - name: Build footydraft
        if: steps.cache-footydraft.outputs.cache-hit != 'true'
        run: |
          cd footydraft
          npm ci
          npm run build

      # Publish an explicit allowlist into _site, never the repo itself.
      #
      # This step is a security boundary, not a convenience. Uploading the
      # whole checkout (which is what this workflow used to do) served every
      # tracked file on the public internet: application source, the handover
      # documents, the forking playbook, and participants' real names and
      # predictions under docs_for_claude/. Add a line here only for something
      # that is genuinely meant to be public.
      - name: Assemble publishable site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Root redirect and the shared game script kupatakip/app.js loads.
          cp index.html _site/
          cp form.js simulate.js _site/

          # Static sites, no build step.
          cp -r kupatakip _site/
          cp -r eventportal _site/

          # kupatakip/index.html references this one asset directory. Copy
          # only the images -- docs_for_claude also holds participants' names
          # and predictions, which must never be published.
          mkdir -p _site/docs_for_claude
          cp -r docs_for_claude/asset_pictures _site/docs_for_claude/

          # Built applications: only dist/, never the source tree.
          mkdir -p _site/zealandtable
          cp -r zealandtable/dist/* _site/zealandtable/

          mkdir -p _site/theirishtable
          cp -r irishtable/dist/* _site/theirishtable/

          mkdir -p _site/iconictable
          cp -r iconictable/dist/* _site/iconictable/

          mkdir -p _site/vizehtable
          cp -r vizehtable/dist/* _site/vizehtable/

          mkdir -p _site/footydraft
          cp -r footydraft/dist/* _site/footydraft/

          # /irishtable/ stays retired forever. A pitch email to Zealandism
          # carries a hyperlink to it, and that email cannot be recalled, so
          # anything served here would be shown to the wrong channel. It
          # bounces to a neutral 404 whose URL names no project.
          mkdir -p _site/not-found _site/irishtable
          cp .github/pages/not-found.html _site/not-found/index.html
          cp .github/pages/retired-redirect.html _site/irishtable/index.html

          echo "--- _site contents ---"
          find _site -maxdepth 2 -not -path '*/assets/*' | sort

      # Fails the deploy if anything private reached _site. Cheap insurance
      # against a future edit to the step above.
      # Three classes of mistake, each of which has already happened once or
      # would have shipped: publishing private files, letting one fork's
      # branding leak into another's bundle, and serving anything at all from
      # the retired /irishtable/ path.
      - name: Verify what is being published
        run: |
          set -uo pipefail
          FAIL=0

          # 1. No private file may reach the artifact. Source files are the
          #    canary: dist/ output is .js/.css/.html, so any .ts/.tsx means
          #    a source tree got copied.
          #
          #    These patterns are deliberately fork-agnostic -- '*HANDOVER*'
          #    catches a new fork's handover without being told its name -- so
          #    adding a fork needs no edit here. Keep it that way.
          LEAKED=$(find _site \
            \( -name '*HANDOVER*' -o -name 'FORKING-PLAYBOOK.md' \
               -o -name 'NEXT-FORK-PROMPT.md' -o -name 'PUBLIC-REPO-RISK.md' \
               -o -name '*.ts' -o -name '*.tsx' -o -name 'round*-answers.md' \
               -o -path '*/predictions/*' -o -name '.env*' \) -print)
          if [ -n "$LEAKED" ]; then
            echo "::error::private files in _site:"; echo "$LEAKED"; FAIL=1
          fi

          # 2. No fork may carry another fork's branding. This is the check
          #    that would catch a rebrand that missed a file -- shipping a
          #    bundle that names the channel it was really built for is the
          #    one outcome forking exists to prevent.
          #
          #    Pairwise, so it is N*(N-1) comparisons and adding a fork means
          #    adding one line here, not 2N greps. Each entry is
          #    "<published dir>|<pattern matching that fork's own branding>".
          #    Match the channel name and the Firebase project, not the site
          #    name: "New Zealand" is real country data in src/data/countries.ts
          #    and must not trip this.
          FORKS=(
            "zealandtable|Zealandism\|zealandtable-app"
            "theirishtable|Irish Guy\|irishtable-app"
            "iconictable|Football Iconic\|iconictable-app"
            "vizehtable|Vizeh\|vizehtable-app"
          )
          for a in "${FORKS[@]}"; do
            DIR_A=${a%%|*}
            if [ ! -d "_site/$DIR_A" ]; then
              echo "::error::_site/$DIR_A is missing -- the assemble step and this guard disagree"
              FAIL=1
              continue
            fi
            for b in "${FORKS[@]}"; do
              DIR_B=${b%%|*}
              PAT_B=${b#*|}
              [ "$DIR_A" = "$DIR_B" ] && continue
              if grep -rlq "$PAT_B" "_site/$DIR_A" 2>/dev/null; then
                echo "::error::$DIR_A bundle leaks $DIR_B branding"; FAIL=1
              fi
            done
          done

          # 3. The burned path must serve only the redirect stub.
          if [ "$(find _site/irishtable -type f | wc -l)" != "1" ] \
             || ! grep -q "not-found" _site/irishtable/index.html; then
            echo "::error::/irishtable/ must contain only the not-found redirect"; FAIL=1
          fi

          if [ "$FAIL" = "0" ]; then echo "clean"; fi
          exit $FAIL

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy (attempt 1)
        id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy (attempt 2)
        id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy (attempt 3)
        if: steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v5

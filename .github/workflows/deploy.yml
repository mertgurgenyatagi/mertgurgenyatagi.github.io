name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://mertgurgenyatagi.github.io/
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            zealandtable/package-lock.json

      - name: Build zealandtable
        run: |
          cd zealandtable
          cat << 'EOF' > .env
          VITE_FIREBASE_API_KEY=AIzaSyCSiZwyKFwZnGncqUcXcfAsZ5WbdPLlmv8
          VITE_FIREBASE_AUTH_DOMAIN=zealandtable-app.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=zealandtable-app
          VITE_FIREBASE_APP_ID=1:1046821268210:web:9d82477de3ead882effe6b
          VITE_FIREBASE_STORAGE_BUCKET=zealandtable-app.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=1046821268210
          VITE_PHOTOS_ENABLED=false
          VITE_FIREBASE_DATABASE_URL=https://zealandtable-app-default-rtdb.europe-west1.firebasedatabase.app
          EOF
          npm ci
          npm run build

      # Publish an explicit allowlist into _site, never the repo itself.
      #
      # This step is a security boundary, not a convenience. Uploading the
      # whole checkout (which is what this workflow used to do) served every
      # tracked file on the public internet: application source, the handover
      # documents, the forking playbook, and participants' real names and
      # predictions under docs_for_claude/. Add a line here only for something
      # that is genuinely meant to be public.
      - name: Assemble publishable site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Root redirect and the shared game script kupatakip/app.js loads.
          cp index.html _site/
          cp form.js simulate.js _site/

          # Static sites, no build step.
          cp -r kupatakip _site/
          cp -r eventportal _site/

          # kupatakip/index.html references this one asset directory. Copy
          # only the images -- docs_for_claude also holds participants' names
          # and predictions, which must never be published.
          mkdir -p _site/docs_for_claude
          cp -r docs_for_claude/asset_pictures _site/docs_for_claude/

          # Built application: only dist/, never the source tree.
          mkdir -p _site/zealandtable
          cp -r zealandtable/dist/* _site/zealandtable/

          # /irishtable/ is retired: a link to it went out in an email that
          # was meant to point at /zealandtable/. It now bounces to a neutral
          # 404 whose URL names neither project. To bring irishtable back,
          # restore a build step for it and drop these two lines.
          mkdir -p _site/not-found _site/irishtable
          cp .github/pages/not-found.html _site/not-found/index.html
          cp .github/pages/retired-redirect.html _site/irishtable/index.html

          echo "--- _site contents ---"
          find _site -maxdepth 2 -not -path '*/assets/*' | sort

      # Fails the deploy if anything private reached _site. Cheap insurance
      # against a future edit to the step above.
      - name: Verify nothing private is being published
        run: |
          set -euo pipefail
          FAIL=0
          for pattern in \
            '_site/**/*HANDOVER*' \
            '_site/FORKING-PLAYBOOK.md' \
            '_site/zealandtable-pivot' \
            '_site/**/src' \
            '_site/docs_for_claude/predictions' ; do
            if compgen -G "$pattern" > /dev/null; then
              echo "::error::private path published: $pattern"; FAIL=1
            fi
          done
          if grep -rlq "Irish Guy\|irishtable-app" _site 2>/dev/null; then
            echo "::error::_site leaks irishtable references:"
            grep -rl "Irish Guy\|irishtable-app" _site | head
            FAIL=1
          fi
          [ "$FAIL" = "0" ] && echo "clean"
          exit $FAIL

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy (attempt 1)
        id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy (attempt 2)
        id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy (attempt 3)
        if: steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v5

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://mertgurgenyatagi.github.io/
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            footydraft/package-lock.json

      # Every project below is cached on the hash of its own source tree,
      # computed right after checkout -- before any build step exists, so
      # dist/ and node_modules/ (both gitignored) can't leak into the hash.
      # A project whose files didn't change gets its dist/ restored instead
      # of rebuilt. This is what keeps one project's commit from spending CI
      # time rebuilding every *other* project too -- each key depends only on
      # that project's own tree, so it's unaffected by anything outside it.
      # A cache miss just means a normal full rebuild; nothing here can
      # publish something stale, only skip redundant work.

      # No .env yet -- footydraft has no backend wired in yet, so there's
      # nothing to inject. Add a heredoc step writing .env before npm ci
      # once Firebase is actually wired into src/.
      - name: Cache footydraft build
        id: cache-footydraft
        uses: actions/cache@v4
        with:
          path: footydraft/dist
          key: footydraft-dist-${{ hashFiles('footydraft/**') }}

      - name: Build footydraft
        if: steps.cache-footydraft.outputs.cache-hit != 'true'
        run: |
          cd footydraft
          npm ci
          npm run build

      # Publish an explicit allowlist into _site, never the repo itself.
      #
      # This step is a security boundary, not a convenience. Uploading the
      # whole checkout (which is what this workflow used to do) served every
      # tracked file on the public internet: application source, the handover
      # documents, the forking playbook, and participants' real names and
      # predictions under docs_for_claude/. Add a line here only for something
      # that is genuinely meant to be public.
      - name: Assemble publishable site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Root redirect and the shared game script kupatakip/app.js loads.
          cp index.html _site/
          cp form.js simulate.js _site/

          # Static sites, no build step.
          cp -r kupatakip _site/
          cp -r eventportal _site/

          # kupatakip/index.html references this one asset directory. Copy
          # only the images -- docs_for_claude also holds participants' names
          # and predictions, which must never be published.
          mkdir -p _site/docs_for_claude
          cp -r docs_for_claude/asset_pictures _site/docs_for_claude/

          # Built applications: only dist/, never the source tree.
          mkdir -p _site/footydraft
          cp -r footydraft/dist/* _site/footydraft/

          # /irishtable/ stays retired forever, even with the irishtable
          # project itself gone. A past pitch email carries a hyperlink to
          # it, and that email cannot be recalled, so anything served here
          # would be shown to the wrong channel. It bounces to a neutral 404
          # whose URL names no project.
          mkdir -p _site/not-found _site/irishtable
          cp .github/pages/not-found.html _site/not-found/index.html
          cp .github/pages/retired-redirect.html _site/irishtable/index.html

          echo "--- _site contents ---"
          find _site -maxdepth 2 -not -path '*/assets/*' | sort

      # Fails the deploy if anything private reached _site. Cheap insurance
      # against a future edit to the step above.
      # Three classes of mistake, each of which has already happened once or
      # would have shipped: publishing private files, letting one fork's
      # branding leak into another's bundle, and serving anything at all from
      # the retired /irishtable/ path.
      - name: Verify what is being published
        run: |
          set -uo pipefail
          FAIL=0

          # 1. No private file may reach the artifact. Source files are the
          #    canary: dist/ output is .js/.css/.html, so any .ts/.tsx means
          #    a source tree got copied.
          #
          #    These patterns are deliberately fork-agnostic -- '*HANDOVER*'
          #    catches a new fork's handover without being told its name -- so
          #    adding a fork needs no edit here. Keep it that way.
          LEAKED=$(find _site \
            \( -name '*HANDOVER*' -o -name 'FORKING-PLAYBOOK.md' \
               -o -name 'NEXT-FORK-PROMPT.md' -o -name 'PUBLIC-REPO-RISK.md' \
               -o -name '*.ts' -o -name '*.tsx' -o -name 'round*-answers.md' \
               -o -path '*/predictions/*' -o -name '.env*' \) -print)
          if [ -n "$LEAKED" ]; then
            echo "::error::private files in _site:"; echo "$LEAKED"; FAIL=1
          fi

          # 2. No fork may carry another fork's branding. This is the check
          #    that would catch a rebrand that missed a file -- shipping a
          #    bundle that names the channel it was really built for is the
          #    one outcome forking exists to prevent.
          #
          #    Pairwise, so it is N*(N-1) comparisons and adding a fork means
          #    adding one line here, not 2N greps. Each entry is
          #    "<published dir>|<pattern matching that fork's own branding>".
          #    Match the channel name and the Firebase project, not the site
          #    name: "New Zealand" is real country data in src/data/countries.ts
          #    and must not trip this.
          FORKS=(
          )
          for a in "${FORKS[@]}"; do
            DIR_A=${a%%|*}
            if [ ! -d "_site/$DIR_A" ]; then
              echo "::error::_site/$DIR_A is missing -- the assemble step and this guard disagree"
              FAIL=1
              continue
            fi
            for b in "${FORKS[@]}"; do
              DIR_B=${b%%|*}
              PAT_B=${b#*|}
              [ "$DIR_A" = "$DIR_B" ] && continue
              if grep -rlq "$PAT_B" "_site/$DIR_A" 2>/dev/null; then
                echo "::error::$DIR_A bundle leaks $DIR_B branding"; FAIL=1
              fi
            done
          done

          # 3. The burned path must serve only the redirect stub.
          if [ "$(find _site/irishtable -type f | wc -l)" != "1" ] \
             || ! grep -q "not-found" _site/irishtable/index.html; then
            echo "::error::/irishtable/ must contain only the not-found redirect"; FAIL=1
          fi

          if [ "$FAIL" = "0" ]; then echo "clean"; fi
          exit $FAIL

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy (attempt 1)
        id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy (attempt 2)
        id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy (attempt 3)
        if: steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v5

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://mertgurgenyatagi.github.io/
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'irishtable/package-lock.json'

      - name: Build irishtable
        run: |
          cd irishtable
          cat << 'EOF' > .env
          VITE_FIREBASE_API_KEY=AIzaSyBMRHhfb3dpWY0RMgpdBvvIbGeBFIl_fbk
          VITE_FIREBASE_AUTH_DOMAIN=irishtable-app.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=irishtable-app
          VITE_FIREBASE_APP_ID=1:378090040193:web:1e133f578f0b6e05c91680
          VITE_FIREBASE_STORAGE_BUCKET=irishtable-app.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=378090040193
          VITE_PHOTOS_ENABLED=false
          VITE_FIREBASE_DATABASE_URL=https://irishtable-app-default-rtdb.europe-west1.firebasedatabase.app
          EOF
          npm ci
          npm run build
          cp -r dist/* .

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy (attempt 1)
        id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy (attempt 2)
        id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy (attempt 3)
        if: steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v5
